<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="demo-mode.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OKV School Management System — Staff Messages</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{background:#FAF6EC;font-family:system-ui,sans-serif;padding:1.25rem;}
  .wrap{max-width:760px;margin:0 auto;}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem;}
  h1{font-size:1.3rem;font-weight:700;color:#14213D;margin:0;}
  .card-panel{background:#fff;border:1px solid #DCD0B4;border-radius:14px;padding:1.25rem;box-shadow:0 6px 24px rgba(20,33,61,.1);margin-bottom:1rem;}
  .card-panel h2{font-size:1rem;font-weight:700;color:#14213D;margin-bottom:.9rem;}
  .btn-forest{background:#14213D;border-color:#14213D;color:#fff;}
  .btn-forest:hover{background:#1D2F55;border-color:#1D2F55;color:#fff;}
  #offlineBanner{display:none;position:fixed;top:0;left:0;right:0;background:#8B1E3F;color:#fff;text-align:center;padding:.5rem;font-weight:600;z-index:2000;}
  .msg-item{border:1px solid #DCD0B4;border-radius:10px;padding:.8rem 1rem;margin-bottom:.6rem;cursor:pointer;}
  .msg-item.unread{background:#FCF3DA;border-color:#E8D27A;}
  .msg-item .msg-from{font-weight:700;color:#14213D;font-size:.85rem;}
  .msg-item .msg-subject{font-size:.85rem;color:#3d3826;}
  .msg-item .msg-time{font-size:.7rem;color:#7a7259;}
  .msg-body-full{white-space:pre-wrap;font-size:.85rem;background:#FAF6EC;border-radius:8px;padding:.7rem;margin-top:.5rem;display:none;}
</style>
</head>
<body>
<div id="offlineBanner"><i class="bi bi-wifi-off"></i> Offline — Staff Messages requires connectivity.</div>

<div class="wrap">
  <div class="topline">
    <h1>Staff Messages</h1>
    <div>
      <a href="dashboard.html" target="_top" class="btn btn-sm btn-outline-secondary">← Dashboard</a>
      <button class="btn btn-sm btn-outline-secondary" onclick="smsLogout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>

  <div class="card-panel">
    <h2><i class="bi bi-send"></i> New Message</h2>
    <div class="row g-2 mb-2">
      <div class="col-md-12">
        <label class="form-label small">To</label>
        <select multiple class="form-select form-select-sm" id="staffRecipients" style="height:100px;"></select>
        <div class="form-text">Hold Ctrl/Cmd to select more than one person.</div>
      </div>
    </div>
    <div class="mb-2">
      <label class="form-label small">Subject</label>
      <input class="form-control form-control-sm" id="staffSubject">
    </div>
    <div class="mb-2">
      <label class="form-label small">Message</label>
      <textarea class="form-control form-control-sm" id="staffBody" rows="3"></textarea>
    </div>
    <button class="btn btn-sm btn-forest" id="sendStaffMsgBtn">Send</button>
    <div id="staffSendMsg" class="small mt-2"></div>
  </div>

  <div class="card-panel">
    <h2><i class="bi bi-inbox"></i> Messages</h2>
    <div id="staffMessagesList"></div>
  </div>
</div>

<script>
const session = JSON.parse(localStorage.getItem('sms_session') || 'null');
if (!session){ window.top.location.href = 'login.html'; }

window.SMS_API_URL = window.SMS_CONFIG.apiUrl;
function updateOnlineState(){ document.getElementById('offlineBanner').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', updateOnlineState); window.addEventListener('offline', updateOnlineState); updateOnlineState();

async function apiCall(payload){
  const res = await fetch(window.SMS_API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ ...payload, sessionToken: session.sessionToken })
  });
  const data = await res.json();
  if (!data.ok && /session/i.test(data.error||'')){ localStorage.removeItem('sms_session'); window.top.location.href='login.html'; }
  return data;
}

let staffUsersCache = [];

async function loadStaffRecipients(){
  const resp = await apiCall({ action:'listOrgUsersBasic' });
  if (!resp.ok) return;
  staffUsersCache = resp.users;
  document.getElementById('staffRecipients').innerHTML = resp.users
    .filter(u => u.userId !== session.userId)
    .map(u => `<option value="${u.userId}">${u.fullName} (${u.username})</option>`).join('');
}

document.getElementById('sendStaffMsgBtn').addEventListener('click', async () => {
  const toUserIds = Array.from(document.getElementById('staffRecipients').selectedOptions).map(o => o.value);
  const subject = document.getElementById('staffSubject').value.trim();
  const msgBody = document.getElementById('staffBody').value.trim();
  const msg = document.getElementById('staffSendMsg');
  if (!toUserIds.length){ msg.textContent = 'Select at least one recipient.'; msg.className='small mt-2 text-danger'; return; }
  if (!msgBody){ msg.textContent = 'Write a message.'; msg.className='small mt-2 text-danger'; return; }
  document.getElementById('sendStaffMsgBtn').disabled = true;
  const resp = await apiCall({ action:'sendStaffMessage', toUserIds, subject, body: msgBody });
  document.getElementById('sendStaffMsgBtn').disabled = false;
  if (!resp.ok){ msg.textContent = resp.error; msg.className='small mt-2 text-danger'; return; }
  msg.textContent = 'Sent.'; msg.className='small mt-2 text-success';
  document.getElementById('staffSubject').value = ''; document.getElementById('staffBody').value = '';
  loadStaffMessages();
});

function nameOf(id){ const u = staffUsersCache.find(x=>x.userId===id); return u ? u.fullName : 'Unknown'; }

async function loadStaffMessages(){
  const resp = await apiCall({ action:'listMyStaffMessages' });
  if (!resp.ok) return;

  document.getElementById('staffMessagesList').innerHTML = resp.messages.map(m => {
    const isMine = m.payload.fromUserId === session.userId;
    const isUnread = !isMine && !(m.payload.readBy||[]).includes(session.userId);
    const toNames = (m.payload.toUserIds||[]).map(nameOf).join(', ');
    return `<div class="msg-item ${isUnread?'unread':''}" data-id="${m.recordId}">
      <div class="msg-from">${isMine ? 'You → ' + toNames : nameOf(m.payload.fromUserId) + ' → You'}</div>
      <div class="msg-subject">${m.payload.subject}</div>
      <div class="msg-time">${new Date(m.payload.sentAt).toLocaleString([], {dateStyle:'short',timeStyle:'short'})}</div>
      <div class="msg-body-full">${(m.payload.body||'').replace(/\n/g,'<br>')}</div>
    </div>`;
  }).join('') || '<div class="small text-muted">No messages yet.</div>';

  document.querySelectorAll('.msg-item').forEach(el => el.addEventListener('click', async () => {
    const body = el.querySelector('.msg-body-full');
    body.style.display = body.style.display === 'block' ? 'none' : 'block';
    if (el.classList.contains('unread')) {
      el.classList.remove('unread');
      await apiCall({ action:'markStaffMessageRead', recordId: el.dataset.id });
      loadStaffMessages();
    }
  }));
}

(async () => {
  await loadStaffRecipients();
  await loadStaffMessages();
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="logout-lib.js"></script>
</body>
</html>
