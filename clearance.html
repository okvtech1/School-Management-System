<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="demo-mode.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OKV School Management System — Finance &amp; Clearance</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{background:#FAF6EC;font-family:system-ui,sans-serif;padding:1.25rem;}
  .wrap{max-width:1000px;margin:0 auto;}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem;}
  h1{font-size:1.3rem;font-weight:700;color:#14213D;margin:0;}
  .card-panel{background:#fff;border:1px solid #DCD0B4;border-radius:14px;padding:1.25rem;box-shadow:0 6px 24px rgba(20,33,61,.1);margin-bottom:1rem;}
  table{font-size:.82rem;}
  th{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:#7a7259;}
  .btn-forest{background:#14213D;border-color:#14213D;color:#fff;}
  .btn-forest:hover{background:#1D2F55;border-color:#1D2F55;color:#fff;}
  #offlineBanner{display:none;position:fixed;top:0;left:0;right:0;background:#8B1E3F;color:#fff;text-align:center;padding:.5rem;font-weight:600;z-index:2000;}
  input.fee-in{width:100px;}
  .badge-cleared{background:#DFF3E4;color:#1E6B3A;font-weight:700;padding:.25em .6em;border-radius:6px;font-size:.72rem;}
  .badge-owing{background:#FADBDD;color:#8B1E3F;font-weight:700;padding:.25em .6em;border-radius:6px;font-size:.72rem;}
  .sync-status{font-size:.78rem;color:#7a7259;}
  .sync-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem;vertical-align:middle;}
  .dot.online{background:#2F6B4F;} .dot.offline{background:#8B1E3F;} .dot.syncing{background:#B8863B;}

  #clearanceSheet{display:none; width:190mm; max-width:100%; margin:0 auto; background:#fff; padding:10mm; box-shadow:0 2px 16px rgba(0,0,0,.2); font-family:"Segoe UI",Arial,sans-serif; color:#1a1a1a; box-sizing:border-box;}
  .cl-title{margin-top:6mm;background:var(--sch-primary);color:var(--sch-on-primary);text-align:center;font-weight:800;font-size:11pt;letter-spacing:.1em;padding:2.4mm 0;border-radius:1mm;}
  .cl-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin:4mm 0 5mm;}
  .cl-meta div{background:#f6f6f4;border:.25mm solid #d6d3c8;border-radius:1.2mm;padding:1.7mm 3mm;font-size:8.8pt;}
  .cl-meta .k{display:block;font-size:5.9pt;letter-spacing:.09em;color:#6b6b6b;text-transform:uppercase;font-weight:700;margin-bottom:.6mm;}
  .cl-meta .v{font-weight:700;}
  .cl-list{width:100%; border-collapse:collapse; font-size:9.4pt;}
  .cl-list th{background:var(--sch-primary);color:var(--sch-on-primary);font-size:7.4pt;letter-spacing:.06em;text-align:left;padding:2.2mm 3mm;}
  .cl-list td{border-bottom:.25mm solid #d6d3c8;padding:2.3mm 3mm;}
  .cl-list tr:nth-child(even) td{background:#f8f8f6;}
  .cl-list .num{width:12mm;color:#666;}
  .cl-list .tick{width:26mm;text-align:center;color:#1E6B3A;font-weight:800;letter-spacing:.04em;font-size:7.6pt;}
  .cl-sign{display:grid;grid-template-columns:1fr 1fr;gap:20mm;margin-top:14mm;font-size:8pt;text-align:center;}
  .cl-sign .box{min-height:18mm;display:flex;flex-direction:column;justify-content:flex-end;}
  .cl-sign img{max-height:14mm;max-width:46mm;object-fit:contain;display:block;margin:0 auto 1mm;}
  .cl-sign .line{border-top:.3mm solid #222;padding-top:1.2mm;font-weight:600;min-height:4.5mm;}
  .cl-sign .lbl{color:#666;font-size:6.6pt;letter-spacing:.07em;text-transform:uppercase;margin-top:.6mm;}
  @media print {
    @page{size:A4 portrait;margin:10mm;}
    body{background:#fff !important;padding:0 !important;}
    body *{visibility:hidden;}
    #clearanceSheet, #clearanceSheet *{visibility:visible;}
    #clearanceSheet{position:absolute; left:0; top:0; width:190mm; padding:0; box-shadow:none;}
    #clearanceSheet tr{break-inside:avoid;page-break-inside:avoid;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div id="offlineBanner"><i class="bi bi-wifi-off"></i> Offline — changes are saved locally and will sync once you're back online.</div>

<div class="wrap">
  <div class="topline">
    <div>
      <h1>Finance &amp; Clearance</h1>
      <div class="sync-status" id="syncStatusText"><span class="dot offline"></span>Checking…</div>
    </div>
    <div>
      <a href="dashboard.html" target="_top" class="btn btn-sm btn-outline-secondary">← Dashboard</a> <button class="btn btn-sm btn-outline-secondary" onclick="smsLogout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      <button class="btn btn-sm btn-forest" id="genClearanceBtn"><i class="bi bi-printer"></i> Generate Clearance List</button>
    </div>
  </div>

  <div class="card-panel">
    <div class="row g-2 align-items-end">
      <div class="col-auto">
        <label class="form-label small">Class</label>
        <select class="form-select form-select-sm" id="classSelect"></select>
      </div>
      <div class="col-auto">
        <label class="form-label small">Arm</label>
        <select class="form-select form-select-sm" id="armSelect"></select>
      </div>
      <div class="col-auto small text-muted" id="termInfo"></div>
    </div>
  </div>

  <div class="card-panel">
    <div class="small text-muted mb-2">Enter the amount due and amount paid per student for this term. A student is <b>Cleared</b> once amount paid ≥ amount due.</div>
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr><th>Student</th><th>Amount Due</th><th>Amount Paid</th><th>Balance</th><th>Status</th></tr></thead>
        <tbody id="feeBody"></tbody>
      </table>
    </div>
    <button class="btn btn-forest" id="saveFeesBtn"><i class="bi bi-check2"></i> Save All</button>
    <div id="saveMsg" class="small mt-2"></div>
  </div>
</div>

<div id="clearanceSheet"></div>

<script src="sync.js"></script>
<script src="settings-lib.js"></script>
<script src="print-lib.js"></script>
<script>
const session = JSON.parse(localStorage.getItem('sms_session') || 'null');
const ALLOWED_ROLES = ['Super Administrator','School Administrator','Bursar / Accountant','Principal / Head Teacher','Academic Officer / Exam Officer'];
const WRITE_ROLES = ['Super Administrator','School Administrator','Bursar / Accountant'];
const roles = (session && session.roles) || [];
if (!session || !roles.some(r => ALLOWED_ROLES.includes(r))){ window.top.location.href = 'dashboard.html'; }
const canWrite = roles.some(r => WRITE_ROLES.includes(r));

window.SMS_API_URL = window.SMS_CONFIG.apiUrl;

function updateOnlineState(){ document.getElementById('offlineBanner').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', updateOnlineState); window.addEventListener('offline', updateOnlineState); updateOnlineState();
function renderSyncStatus(detail){
  const el = document.getElementById('syncStatusText');
  const dotClass = detail.syncing ? 'syncing' : (detail.online ? 'online' : 'offline');
  const label = detail.syncing ? 'Syncing…' : (detail.online ? 'Online' : 'Offline');
  const pendingTxt = detail.pending ? ` — ${detail.pending} pending` : '';
  el.innerHTML = `<span class="dot ${dotClass}"></span>${label}${pendingTxt}`;
}
window.smsSync.onStatus(renderSyncStatus);

let settingsState = null;
let students = [];
let feeRecords = [];

function fillArmSelect(){
  const cls = document.getElementById('classSelect').value;
  const arms = (settingsState.classArms||{})[cls] || [];
  document.getElementById('armSelect').innerHTML = arms.length
    ? arms.map(a=>`<option value="${a}">${a}</option>`).join('')
    : '<option value="">(no arms)</option>';
}

async function loadAll(){
  const { payload } = await window.smsSettings.getSettings();
  settingsState = payload;
  document.getElementById('termInfo').textContent = `${settingsState.currentTerm||''} · ${settingsState.currentSession||''}`;
  document.getElementById('classSelect').innerHTML = (settingsState.classes||[]).map(c=>`<option value="${c}">${c}</option>`).join('');
  fillArmSelect();
  document.getElementById('classSelect').addEventListener('change', () => { fillArmSelect(); loadClass(); });
  document.getElementById('armSelect').addEventListener('change', loadClass);

  if (!canWrite) document.getElementById('saveFeesBtn').style.display = 'none';
  await loadClass();
}

async function loadClass(){
  const cls = document.getElementById('classSelect').value;
  const arm = document.getElementById('armSelect').value;
  const allStudents = await window.smsSync.getRecords('student');
  students = allStudents.filter(r => r.payload.class === cls && (r.payload.arm||'') === (arm||'') && r.payload.active !== false);
  const allFees = await window.smsSync.getRecords('feeRecord');
  feeRecords = allFees.filter(r => r.payload.term === settingsState.currentTerm && r.payload.session === settingsState.currentSession);
  renderTable();
}

function renderTable(){
  const body = document.getElementById('feeBody');
  body.innerHTML = students.map(s => {
    const fee = feeRecords.find(r => r.payload.studentId === s.recordId);
    const due = fee ? fee.payload.amountDue : '';
    const paid = fee ? fee.payload.amountPaid : '';
    return `<tr data-student-row="${s.recordId}">
      <td>${s.payload.fullName}</td>
      <td><input type="number" min="0" class="form-control form-control-sm fee-in due-in" value="${due}" ${!canWrite?'disabled':''}></td>
      <td><input type="number" min="0" class="form-control form-control-sm fee-in paid-in" value="${paid}" ${!canWrite?'disabled':''}></td>
      <td class="balance-cell">—</td>
      <td class="status-cell">—</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="text-center text-muted py-3">No students in this class/arm.</td></tr>';

  document.querySelectorAll('.due-in, .paid-in').forEach(inp => inp.addEventListener('input', () => recomputeRow(inp.closest('tr'))));
  document.querySelectorAll('tr[data-student-row]').forEach(recomputeRow);
}

function recomputeRow(row){
  const due = Number(row.querySelector('.due-in').value) || 0;
  const paid = Number(row.querySelector('.paid-in').value) || 0;
  const balance = Math.max(0, due - paid);
  const cleared = due > 0 && paid >= due;
  row.querySelector('.balance-cell').textContent = balance;
  row.querySelector('.status-cell').innerHTML = due === 0
    ? '<span class="text-muted small">Not set</span>'
    : (cleared ? '<span class="badge-cleared">Cleared</span>' : '<span class="badge-owing">Owing</span>');
}

document.getElementById('saveFeesBtn').addEventListener('click', async () => {
  const msg = document.getElementById('saveMsg');
  msg.textContent = 'Saving...'; msg.className = 'small mt-2 text-muted';
  document.getElementById('saveFeesBtn').disabled = true;

  for (const s of students) {
    const row = document.querySelector(`tr[data-student-row="${s.recordId}"]`);
    const due = Number(row.querySelector('.due-in').value) || 0;
    const paid = Number(row.querySelector('.paid-in').value) || 0;
    if (!due && !paid) continue; // skip untouched rows
    const existing = feeRecords.find(r => r.payload.studentId === s.recordId);
    const payload = { studentId: s.recordId, term: settingsState.currentTerm, session: settingsState.currentSession, amountDue: due, amountPaid: paid };
    const newId = await window.smsSync.saveRecord('feeRecord', payload, existing ? existing.recordId : null);
    if (existing) existing.payload = payload;
    else feeRecords.push({ recordId: newId, type: 'feeRecord', payload });
  }
  msg.textContent = navigator.onLine ? 'Saved.' : "Saved locally — will sync when you're back online.";
  msg.className = 'small mt-2 text-success';
  document.getElementById('saveFeesBtn').disabled = false;
});

document.getElementById('genClearanceBtn').addEventListener('click', () => {
  const cls = document.getElementById('classSelect').value;
  const arm = document.getElementById('armSelect').value;
  const cleared = students.filter(s => {
    const fee = feeRecords.find(r => r.payload.studentId === s.recordId);
    return fee && fee.payload.amountDue > 0 && fee.payload.amountPaid >= fee.payload.amountDue;
  });
  if (!cleared.length){ alert('No cleared students in this class/arm yet.'); return; }

  const b = window.smsPrint.brand(settingsState);
  window.smsPrint.applyTheme(b);
  const esc = window.smsPrint.esc;
  const sess = settingsState.currentSession || '';
  const owing = students.length - cleared.length;
  document.getElementById('clearanceSheet').innerHTML = `
    ${window.smsPrint.letterhead(b)}
    <div class="cl-title">TEST / EXAM CLEARANCE LIST</div>
    <div class="cl-meta">
      <div><span class="k">Class</span><span class="v">${esc((cls + ' ' + (arm||'')).trim())}</span></div>
      <div><span class="k">Term</span><span class="v">${esc(settingsState.currentTerm || '')}</span></div>
      <div><span class="k">Session</span><span class="v">${esc(sess)}</span></div>
      <div><span class="k">Cleared</span><span class="v">${cleared.length} of ${students.length}</span></div>
    </div>
    <table class="cl-list">
      <thead><tr><th>#</th><th>Student name</th><th>Admission no.</th><th style="text-align:center;">Status</th></tr></thead>
      <tbody>${cleared.map((s,i) => `<tr><td class="num">${i+1}</td><td>${esc(s.payload.fullName)}</td><td>${esc(s.payload.admissionNo||'-')}</td><td class="tick">CLEARED</td></tr>`).join('')}</tbody>
    </table>
    <div class="cl-sign">
      <div class="box"><div class="line"></div><div class="lbl">Bursar / Accountant</div></div>
      <div class="box">${settingsState.principalSignature ? `<img src="${esc(settingsState.principalSignature)}" alt="">` : ''}<div class="line">${esc(settingsState.principalName || '')}</div><div class="lbl">Principal / Head teacher</div></div>
    </div>
    ${window.smsPrint.footer(b, 'Generated ' + esc(new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' })))}`;
  document.getElementById('clearanceSheet').style.display = 'block';
  setTimeout(() => window.print(), 300);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadAll();
</script>
<script src="logout-lib.js"></script>
</body>
</html>
