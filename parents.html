<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="demo-mode.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OKV School Management System — Parents</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{background:#FAF6EC;font-family:system-ui,sans-serif;padding:1.25rem;}
  .wrap{max-width:1000px;margin:0 auto;}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem;}
  h1{font-size:1.3rem;font-weight:700;color:#14213D;margin:0;}
  .card-panel{background:#fff;border:1px solid #DCD0B4;border-radius:14px;padding:1.25rem;box-shadow:0 6px 24px rgba(20,33,61,.1);}
  table{font-size:.85rem;}
  th{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:#7a7259;}
  .btn-forest{background:#14213D;border-color:#14213D;color:#fff;}
  .btn-forest:hover{background:#1D2F55;border-color:#1D2F55;color:#fff;}
  #offlineBanner{display:none;position:fixed;top:0;left:0;right:0;background:#8B1E3F;color:#fff;text-align:center;padding:.5rem;font-weight:600;z-index:2000;}
  .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;}
  .import-instructions{background:#FCF3DA;border:1px solid #E8D27A;border-radius:10px;padding:.9rem 1rem;font-size:.82rem;color:#5b5442;margin-bottom:1rem;}
  .import-instructions code{background:#fff;border:1px solid #E8D27A;border-radius:4px;padding:.05rem .35rem;}
  .import-instructions table{font-size:.78rem;margin-top:.5rem;}
  .import-result{font-size:.82rem;white-space:pre-wrap;max-height:180px;overflow:auto;background:#FAF6EC;border-radius:8px;padding:.6rem;margin-top:.7rem;}
  .student-badge{display:inline-block;background:#F1E7D3;color:#93672B;font-size:.72rem;font-weight:600;padding:.2em .5em;border-radius:6px;margin:0 .2rem .2rem 0;}
  .sync-status{font-size:.78rem;color:#7a7259;}
  .sync-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem;vertical-align:middle;}
  .dot.online{background:#2F6B4F;} .dot.offline{background:#8B1E3F;} .dot.syncing{background:#B8863B;}
</style>
</head>
<body>
<div id="offlineBanner"><i class="bi bi-wifi-off"></i> Offline — changes are saved locally and will sync once you're back online.</div>

<div class="wrap">
  <div class="topline">
    <div>
      <h1>Parents / Guardians</h1>
      <div class="sync-status" id="syncStatusText"><span class="dot offline"></span>Checking…</div>
    </div>
    <div>
      <a href="dashboard.html" target="_top" class="btn btn-sm btn-outline-secondary">← Dashboard</a> <button class="btn btn-sm btn-outline-secondary" onclick="smsLogout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
      <button class="btn btn-sm btn-outline-secondary" id="exportCsvBtn"><i class="bi bi-download"></i> Export CSV</button>
      <button class="btn btn-sm btn-forest" id="newBtn" data-bs-toggle="modal" data-bs-target="#recordModal">+ New Parent</button>
    </div>
  </div>

  <div class="card-panel">
    <div class="filters">
      <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="Search name or phone" style="max-width:260px;">
    </div>
    <div class="table-responsive">
      <table class="table" id="dataTable">
        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Linked Students</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal fade" id="recordModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalTitle">New Parent</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="f_recordId">
        <div class="mb-2"><label class="form-label small">Full Name</label><input class="form-control form-control-sm" id="f_fullName" required></div>
        <div class="mb-2"><label class="form-label small">Phone</label><input class="form-control form-control-sm" id="f_phone"></div>
        <div class="mb-2"><label class="form-label small">Email</label><input type="email" class="form-control form-control-sm" id="f_email"></div>
        <div class="mb-2"><label class="form-label small">Address</label><textarea class="form-control form-control-sm" id="f_address" rows="2"></textarea></div>
        <div class="mb-2">
          <label class="form-label small">Linked Students</label>
          <select multiple class="form-select form-select-sm" id="f_linkedStudents" style="height:140px;"></select>
          <div class="form-text">Hold Ctrl/Cmd to select more than one.</div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-forest" id="saveBtn">Save</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="sync.js"></script>
<script src="csv-lib.js"></script>
<script>
const RECORD_TYPE = 'parent';
const session = JSON.parse(localStorage.getItem('sms_session') || 'null');
const READ_ROLES = ['Super Administrator','School Administrator','Principal / Head Teacher','Academic Officer / Exam Officer'];
const WRITE_ROLES = ['Super Administrator','School Administrator','Principal / Head Teacher','Academic Officer / Exam Officer'];
const roles = (session && session.roles) || [];
if (!session || !roles.some(r => READ_ROLES.includes(r))){ window.top.location.href = 'dashboard.html'; }
const canWrite = roles.some(r => WRITE_ROLES.includes(r));

window.SMS_API_URL = window.SMS_CONFIG.apiUrl;

function updateOnlineState(){ document.getElementById('offlineBanner').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', updateOnlineState); window.addEventListener('offline', updateOnlineState); updateOnlineState();
function renderSyncStatus(detail){
  const el = document.getElementById('syncStatusText');
  const dotClass = detail.syncing ? 'syncing' : (detail.online ? 'online' : 'offline');
  const label = detail.syncing ? 'Syncing…' : (detail.online ? 'Online' : 'Offline');
  const pendingTxt = detail.pending ? ` — ${detail.pending} pending` : '';
  el.innerHTML = `<span class="dot ${dotClass}"></span>${label}${pendingTxt}`;
}
window.smsSync.onStatus(renderSyncStatus);

if (!canWrite){ document.getElementById('newBtn').style.display = 'none'; }

let allRecords = [];
let allStudents = [];

async function loadAll(){
  allStudents = await window.smsSync.getRecords('student');
  document.getElementById('f_linkedStudents').innerHTML = allStudents
    .sort((a,b)=>(a.payload.fullName||'').localeCompare(b.payload.fullName||''))
    .map(s=>`<option value="${s.recordId}">${escapeHtml(s.payload.fullName)} (${escapeHtml(s.payload.admissionNo||'')})</option>`).join('');
  allRecords = await window.smsSync.getRecords(RECORD_TYPE);
  renderTable();
}
function studentLabel(recordId){
  const s = allStudents.find(x=>x.recordId===recordId);
  return s ? s.payload.fullName : '(removed student)';
}
function matchesFilters(rec){
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  const p = rec.payload;
  if (q && !(`${p.fullName} ${p.phone}`.toLowerCase().includes(q))) return false;
  return true;
}
function renderTable(){
  const rows = allRecords.filter(matchesFilters).sort((a,b)=>(a.payload.fullName||'').localeCompare(b.payload.fullName||''));
  document.querySelector('#dataTable tbody').innerHTML = rows.map(r => {
    const p = r.payload;
    const linked = (p.linkedStudentIds||[]).map(id=>`<span class="student-badge">${escapeHtml(studentLabel(id))}</span>`).join('') || '<span class="text-muted small">None</span>';
    return `<tr>
      <td>${escapeHtml(p.fullName||'')}</td>
      <td>${escapeHtml(p.phone||'—')}</td>
      <td>${escapeHtml(p.email||'—')}</td>
      <td>${linked}</td>
      <td class="text-end">
        ${canWrite ? `<button class="btn btn-sm btn-outline-secondary edit-btn" data-id="${r.recordId}">Edit</button>
        <button class="btn btn-sm btn-outline-danger del-btn" data-id="${r.recordId}">Delete</button>` : ''}
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="text-center text-muted py-3">No parents found.</td></tr>`;

  document.querySelectorAll('.edit-btn').forEach(b=>b.addEventListener('click', ()=>openEdit(b.dataset.id)));
  document.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click', async ()=>{
    if (!confirm('Delete this parent record?')) return;
    await window.smsSync.deleteRecord(b.dataset.id);
    allRecords = allRecords.filter(r=>r.recordId!==b.dataset.id);
    renderTable();
  }));
}
document.getElementById('filterSearch').addEventListener('input', renderTable);

function resetForm(){
  ['f_recordId','f_fullName','f_phone','f_email','f_address'].forEach(id=>document.getElementById(id).value='');
  Array.from(document.getElementById('f_linkedStudents').options).forEach(o=>o.selected=false);
}
document.getElementById('newBtn').addEventListener('click', ()=>{
  document.getElementById('modalTitle').textContent = 'New Parent';
  resetForm();
});
function openEdit(recordId){
  const rec = allRecords.find(r=>r.recordId===recordId);
  if (!rec) return;
  const p = rec.payload;
  document.getElementById('modalTitle').textContent = 'Edit Parent';
  document.getElementById('f_recordId').value = recordId;
  document.getElementById('f_fullName').value = p.fullName||'';
  document.getElementById('f_phone').value = p.phone||'';
  document.getElementById('f_email').value = p.email||'';
  document.getElementById('f_address').value = p.address||'';
  const linked = new Set(p.linkedStudentIds||[]);
  Array.from(document.getElementById('f_linkedStudents').options).forEach(o=> o.selected = linked.has(o.value));
  new bootstrap.Modal(document.getElementById('recordModal')).show();
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const recordId = document.getElementById('f_recordId').value || null;
  const fullName = document.getElementById('f_fullName').value.trim();
  if (!fullName){ alert('Full name is required.'); return; }
  const linkedStudentIds = Array.from(document.getElementById('f_linkedStudents').selectedOptions).map(o=>o.value);
  const payload = {
    fullName,
    phone: document.getElementById('f_phone').value.trim(),
    email: document.getElementById('f_email').value.trim(),
    address: document.getElementById('f_address').value.trim(),
    linkedStudentIds
  };
  const newId = await window.smsSync.saveRecord(RECORD_TYPE, payload, recordId);
  bootstrap.Modal.getInstance(document.getElementById('recordModal')).hide();
  if (recordId){
    const idx = allRecords.findIndex(r=>r.recordId===recordId);
    if (idx>-1) allRecords[idx] = { ...allRecords[idx], payload };
  } else {
    allRecords.push({ recordId: newId, type: RECORD_TYPE, payload });
  }
  renderTable();
});

/* ====== CSV Export ====== */
document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
  if (!allRecords.length){ alert('No parents to export.'); return; }
  const cols = ['fullName','phone','email','address'];
  const lines = [cols.join(',') + ',linkedStudents'];
  allRecords.forEach(r => {
    const linkedNames = (r.payload.linkedStudentIds||[]).map(studentLabel).join('; ');
    lines.push(cols.map(c=>csvEscape(r.payload[c])).join(',') + ',' + csvEscape(linkedNames));
  });
  downloadCsv(lines.join('\n'), `parents-export-${Date.now()}.csv`);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadAll();
</script>
<script src="logout-lib.js"></script>
</body>
</html>
