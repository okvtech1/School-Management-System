<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="demo-mode.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OKV School Management System — Reset Password</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body{background:#14213D;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:1rem;}
  .card-auth{background:#fff;border-radius:16px;padding:2rem;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .card-auth h1{font-size:1.3rem;font-weight:700;color:#14213D;margin-bottom:.25rem;}
  .btn-primary{background:#14213D;border-color:#14213D;}
  .btn-primary:hover{background:#1D2F55;border-color:#1D2F55;}
  a{color:#B8863B;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="card-auth">
  <div id="stateInvalid" style="display:none;">
    <h1>Link Invalid or Expired</h1>
    <p class="text-muted small">This reset link is no longer valid. Reset links expire after 30 minutes and can only be used once.</p>
    <a href="login.html">Return to login</a>
  </div>

  <div id="stateForm">
    <h1>Set a New Password</h1>
    <p class="text-muted small mb-3">Choose a new password for your account.</p>
    <form id="resetForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold">New Password</label>
        <input type="password" class="form-control" id="newPassword" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Confirm New Password</label>
        <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="resetBtn">Reset Password</button>
      <div id="resetMsg" class="small mt-2"></div>
    </form>
  </div>

  <div id="stateDone" style="display:none;">
    <h1>Password Updated</h1>
    <p class="text-muted small">Your password has been changed. You can now sign in.</p>
    <a href="login.html">Go to login</a>
  </div>
</div>

<script>
const API_URL = window.SMS_CONFIG.apiUrl;
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function apiCall(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

if (!token){
  document.getElementById('stateForm').style.display = 'none';
  document.getElementById('stateInvalid').style.display = 'block';
}

document.getElementById('resetForm')?.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('resetMsg');
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  if (p1 !== p2){ msg.textContent = 'Passwords do not match.'; msg.className = 'small text-danger mt-2'; return; }

  document.getElementById('resetBtn').disabled = true;
  msg.textContent = 'Updating...'; msg.className = 'small text-muted mt-2';
  try{
    const newPasswordHash = await sha256(p1);
    const resp = await apiCall({ action:'resetPassword', token, newPasswordHash });
    if (!resp.ok){
      document.getElementById('stateForm').style.display = 'none';
      document.getElementById('stateInvalid').style.display = 'block';
      document.getElementById('stateInvalid').querySelector('p').textContent = resp.error;
      return;
    }
    document.getElementById('stateForm').style.display = 'none';
    document.getElementById('stateDone').style.display = 'block';
  }catch(err){
    msg.textContent = 'Could not reach the server.'; msg.className = 'small text-danger mt-2';
    document.getElementById('resetBtn').disabled = false;
  }
});
</script>
<script src="pw-toggle.js"></script>
</body>
</html>
