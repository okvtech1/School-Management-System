<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<script src="demo-mode.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>OKV School Management System — Enter Scores</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  body{background:#FAF6EC;font-family:system-ui,sans-serif;padding:1.25rem;}
  .wrap{max-width:1000px;margin:0 auto;}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem;}
  h1{font-size:1.3rem;font-weight:700;color:#14213D;margin:0;}
  .card-panel{background:#fff;border:1px solid #DCD0B4;border-radius:14px;padding:1.25rem;box-shadow:0 6px 24px rgba(20,33,61,.1);margin-bottom:1rem;}
  table{font-size:.82rem;}
  th{font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:#7a7259;}
  .btn-forest{background:#14213D;border-color:#14213D;color:#fff;}
  .btn-forest:hover{background:#1D2F55;border-color:#1D2F55;color:#fff;}
  #offlineBanner{display:none;position:fixed;top:0;left:0;right:0;background:#8B1E3F;color:#fff;text-align:center;padding:.5rem;font-weight:600;z-index:2000;}
  input.score-in{width:56px;padding:.2rem .35rem;font-size:.8rem;}
  .grade-badge{font-weight:700;padding:.15em .5em;border-radius:5px;font-size:.75rem;}
  .grade-A{background:#DFF3E4;color:#1E6B3A;} .grade-B{background:#E4F0FB;color:#1D5A9C;}
  .grade-C{background:#FCF3DA;color:#8A6A12;} .grade-D{background:#FBE7DA;color:#A14E1B;}
  .grade-E{background:#FBE7DA;color:#A14E1B;} .grade-F{background:#FADBDD;color:#8B1E3F;}
  .sync-status{font-size:.78rem;color:#7a7259;}
  .sync-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem;vertical-align:middle;}
  .dot.online{background:#2F6B4F;} .dot.offline{background:#8B1E3F;} .dot.syncing{background:#B8863B;}
  .no-perm-note{font-size:.82rem;color:#8A6A12;background:#FCF3DA;border-radius:10px;padding:.6rem .8rem;}
</style>
</head>
<body>
<div id="offlineBanner"><i class="bi bi-wifi-off"></i> Offline — scores are saved locally and will sync once you're back online.</div>

<div class="wrap">
  <div class="topline">
    <div>
      <h1>Enter Scores</h1>
      <div class="sync-status" id="syncStatusText"><span class="dot offline"></span>Checking…</div>
    </div>
    <a href="dashboard.html" target="_top" class="btn btn-sm btn-outline-secondary">← Dashboard</a> <button class="btn btn-sm btn-outline-secondary" onclick="smsLogout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </div>

  <div class="card-panel">
    <div class="row g-2 align-items-end mb-2">
      <div class="col-auto">
        <label class="form-label small">Class / Subject</label>
        <select class="form-select form-select-sm" id="assignmentSelect" style="min-width:260px;"></select>
      </div>
      <div class="col-auto small text-muted" id="termInfo"></div>
    </div>
    <div id="noAssignmentsNote" class="no-perm-note" style="display:none;">You don't have any subjects assigned to you yet. Ask your school admin to assign you a class and subject in <em>Class &amp; Subject Assignment</em>.</div>
  </div>

  <div class="card-panel" id="scoreCard" style="display:none;">
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead><tr id="scoreHeadRow"><th>Student</th></tr></thead>
        <tbody id="scoreBody"></tbody>
      </table>
    </div>
    <button class="btn btn-forest" id="saveScoresBtn"><i class="bi bi-check2"></i> Save All Scores</button>
    <div id="saveMsg" class="small mt-2"></div>
  </div>
</div>

<script src="sync.js"></script>
<script src="settings-lib.js"></script>
<script src="results-lib.js"></script>
<script>
const session = JSON.parse(localStorage.getItem('sms_session') || 'null');
if (!session){ window.top.location.href = 'login.html'; }
const roles = session.roles || [];
const ADMIN_TIER = ['Super Administrator','School Administrator','Principal / Head Teacher','Academic Officer / Exam Officer'];
const canEnter = roles.includes('Teacher') || roles.some(r => ADMIN_TIER.includes(r));
if (!canEnter){ window.top.location.href = 'dashboard.html'; }

window.SMS_API_URL = window.SMS_CONFIG.apiUrl;

function updateOnlineState(){ document.getElementById('offlineBanner').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', updateOnlineState); window.addEventListener('offline', updateOnlineState); updateOnlineState();
function renderSyncStatus(detail){
  const el = document.getElementById('syncStatusText');
  const dotClass = detail.syncing ? 'syncing' : (detail.online ? 'online' : 'offline');
  const label = detail.syncing ? 'Syncing…' : (detail.online ? 'Online' : 'Offline');
  const pendingTxt = detail.pending ? ` — ${detail.pending} pending` : '';
  el.innerHTML = `<span class="dot ${dotClass}"></span>${label}${pendingTxt}`;
}
window.smsSync.onStatus(renderSyncStatus);

async function apiCall(payload){
  const res = await fetch(window.SMS_API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ ...payload, sessionToken: session.sessionToken })
  });
  return res.json();
}

let settingsState = null;
let myAssignments = [];   // {class, arm, subject}
let students = [];
let existingScores = [];
let caCount = 3;

function sectionForClass(cls){
  return (settingsState.classSections||{})[cls] || 'Secondary';
}

async function loadAll(){
  const { payload } = await window.smsSettings.getSettings();
  settingsState = payload;

  const isAdminTier = roles.some(r => ADMIN_TIER.includes(r));
  if (isAdminTier) {
    // Admin-tier: can enter for any class+arm+subject combo.
    myAssignments = [];
    (settingsState.classes||[]).forEach(cls => {
      const arms = (settingsState.classArms||{})[cls] || [''];
      arms.forEach(arm => window.smsSettings.subjectsForClass(settingsState, cls).forEach(subject => {
        myAssignments.push({ class: cls, arm, subject });
      }));
    });
  } else {
    const subjectAssignments = await window.smsSync.getRecords('subjectAssignment');
    myAssignments = subjectAssignments.filter(r => r.payload.teacherUserId === session.userId).map(r => r.payload);
  }

  const sel = document.getElementById('assignmentSelect');
  if (!myAssignments.length){
    document.getElementById('noAssignmentsNote').style.display = 'block';
    return;
  }
  sel.innerHTML = myAssignments.map((a,i) => `<option value="${i}">${a.class}${a.arm?' '+a.arm:''} — ${a.subject}</option>`).join('');
  document.getElementById('termInfo').textContent = `${settingsState.currentTerm || ''} · ${settingsState.currentSession || ''}`;
  sel.addEventListener('change', loadAssignment);
  await loadAssignment();
}

async function loadAssignment(){
  const sel = document.getElementById('assignmentSelect');
  const a = myAssignments[Number(sel.value)];
  if (!a) return;

  caCount = (settingsState.caCounts || {})[sectionForClass(a.class)] || 3;

  const allStudents = await window.smsSync.getRecords('student');
  students = allStudents.filter(r => r.payload.class === a.class && (r.payload.arm||'') === (a.arm||'') && r.payload.active !== false);

  const allScores = await window.smsSync.getRecords('score');
  existingScores = allScores.filter(r =>
    r.payload.class === a.class && (r.payload.arm||'') === (a.arm||'') && r.payload.subject === a.subject &&
    r.payload.term === settingsState.currentTerm && r.payload.session === settingsState.currentSession);

  renderTable(a);
}

function renderTable(a){
  const headRow = document.getElementById('scoreHeadRow');
  let headHtml = '<th>Student</th>';
  for (let i=1;i<=caCount;i++) headHtml += `<th>CA${i}</th>`;
  headHtml += '<th>Exam</th><th>Total</th><th>Grade</th><th>Remark</th>';
  headRow.innerHTML = headHtml;

  const body = document.getElementById('scoreBody');
  if (!students.length){
    body.innerHTML = `<tr><td colspan="${caCount+5}" class="text-center text-muted py-3">No students found in ${a.class} ${a.arm||''}.</td></tr>`;
    document.getElementById('scoreCard').style.display = 'block';
    return;
  }

  body.innerHTML = students.map(s => {
    const existing = existingScores.find(r => r.payload.studentId === s.recordId);
    const ca = existing ? (existing.payload.ca || []) : [];
    const exam = existing ? existing.payload.exam : '';
    let cells = `<td>${s.payload.fullName}</td>`;
    for (let i=0;i<caCount;i++){
      cells += `<td><input type="number" min="0" class="form-control form-control-sm score-in ca-in" data-student="${s.recordId}" data-idx="${i}" value="${ca[i] ?? ''}"></td>`;
    }
    cells += `<td><input type="number" min="0" class="form-control form-control-sm score-in exam-in" data-student="${s.recordId}" value="${exam ?? ''}"></td>`;
    cells += `<td class="total-cell" data-student="${s.recordId}">—</td>`;
    cells += `<td class="grade-cell" data-student="${s.recordId}">—</td>`;
    cells += `<td class="remark-cell small text-muted" data-student="${s.recordId}">—</td>`;
    return `<tr data-student-row="${s.recordId}">${cells}</tr>`;
  }).join('');

  document.getElementById('scoreCard').style.display = 'block';
  document.querySelectorAll('.ca-in, .exam-in').forEach(inp => inp.addEventListener('input', () => recomputeRow(inp.dataset.student)));
  students.forEach(s => recomputeRow(s.recordId));
}

// The school's grading method (A–F or WAEC A1–F9) from Settings; old records are re-graded from their totals.
function gradingMethodNow(){ return window.smsResults.normMethod(settingsState && settingsState.gradingMethod); }

function recomputeRow(studentId){
  const row = document.querySelector(`tr[data-student-row="${studentId}"]`);
  if (!row) return;
  const caVals = Array.from(row.querySelectorAll('.ca-in')).map(i => Number(i.value) || 0);
  const examVal = Number(row.querySelector('.exam-in').value) || 0;
  const { total, grade, remark } = window.smsResults.subjectTotal(caVals, examVal, gradingMethodNow());
  row.querySelector('.total-cell').textContent = total;
  const gradeCell = row.querySelector('.grade-cell');
  gradeCell.innerHTML = `<span class="grade-badge grade-${window.smsResults.gradeClass(grade)}">${grade}</span>`;
  row.querySelector('.remark-cell').textContent = remark;
}

document.getElementById('saveScoresBtn').addEventListener('click', async () => {
  const sel = document.getElementById('assignmentSelect');
  const a = myAssignments[Number(sel.value)];
  const msg = document.getElementById('saveMsg');
  msg.textContent = 'Saving...'; msg.className = 'small mt-2 text-muted';
  document.getElementById('saveScoresBtn').disabled = true;

  for (const s of students) {
    const row = document.querySelector(`tr[data-student-row="${s.recordId}"]`);
    const caVals = Array.from(row.querySelectorAll('.ca-in')).map(i => Number(i.value) || 0);
    const examVal = Number(row.querySelector('.exam-in').value) || 0;
    const { total, grade, remark } = window.smsResults.subjectTotal(caVals, examVal, gradingMethodNow());
    const existing = existingScores.find(r => r.payload.studentId === s.recordId);
    const payload = {
      studentId: s.recordId, class: a.class, arm: a.arm || '', subject: a.subject,
      term: settingsState.currentTerm, session: settingsState.currentSession,
      ca: caVals, exam: examVal, total, grade, remark, teacherUserId: session.userId
    };
    const newId = await window.smsSync.saveRecord('score', payload, existing ? existing.recordId : null);
    if (existing) existing.payload = payload;
    else existingScores.push({ recordId: newId, type: 'score', payload });
  }

  msg.textContent = navigator.onLine ? 'All scores saved.' : "Saved locally — will sync when you're back online.";
  msg.className = 'small mt-2 text-success';
  document.getElementById('saveScoresBtn').disabled = false;
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
loadAll();
</script>
<script src="logout-lib.js"></script>
</body>
</html>
